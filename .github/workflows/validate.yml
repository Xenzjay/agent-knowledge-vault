name: Validate Knowledge Workspace

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository
        shell: pwsh
        run: ./scripts/validate.ps1

      - name: Run smoke tests
        shell: pwsh
        run: ./scripts/smoke-test.ps1
